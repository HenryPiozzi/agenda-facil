<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgendaFácil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; }

    nav {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      padding: 0 2rem;
    }
    nav button {
      padding: 0.9rem 1.25rem;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.9rem;
      color: #6b7280;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    nav button.ativo {
      color: #2563eb;
      border-bottom-color: #2563eb;
      font-weight: 500;
    }

    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }

    .secao { display: none; }
    .secao.ativa { display: block; }

    .card {
      background: white;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #111; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .grid.col3 { grid-template-columns: 1fr 1fr 1fr; }

    label { font-size: 0.8rem; color: #6b7280; display: block; margin-bottom: 0.25rem; }

    input, select, textarea {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus, select:focus { border-color: #2563eb; }

    .btn {
      padding: 0.6rem 1.25rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-sm { padding: 0.3rem 0.75rem; font-size: 0.8rem; }

    .mt { margin-top: 1rem; }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { text-align: left; padding: 0.6rem 0.75rem; background: #f9fafb; color: #6b7280; font-weight: 500; font-size: 0.8rem; border-bottom: 1px solid #e5e7eb; }
    td { padding: 0.75rem; border-bottom: 1px solid #f3f4f6; }
    tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .badge-pendente { background: #fef3c7; color: #92400e; }
    .badge-confirmado { background: #d1fae5; color: #065f46; }
    .badge-cancelado { background: #fee2e2; color: #991b1b; }
    .badge-concluido { background: #e0e7ff; color: #3730a3; }

    .alerta { padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.875rem; margin-bottom: 1rem; }
    .alerta-erro { background: #fee2e2; color: #991b1b; }
    .alerta-ok { background: #d1fae5; color: #065f46; }

    .vazio { text-align: center; padding: 2rem; color: #9ca3af; font-size: 0.9rem; }

    .acoes { display: flex; gap: 0.4rem; }
  </style>
</head>
<body>

<header>
  <span style="font-size:1.5rem">✂️</span>
  <h1>AgendaFácil</h1>
</header>

<nav>
  <button class="ativo" onclick="trocarAba('agendamentos')">Agendamentos</button>
  <button onclick="trocarAba('novo-agendamento')">Novo Agendamento</button>
  <button onclick="trocarAba('clientes')">Clientes</button>
  <button onclick="trocarAba('profissionais')">Profissionais</button>
  <button onclick="trocarAba('servicos')">Serviços</button>
</nav>

<main>
  <div id="alerta" style="display:none"></div>

  <!-- ── AGENDAMENTOS ── -->
  <div id="sec-agendamentos" class="secao ativa">
    <div class="card">
      <h2>Agendamentos</h2>
      <div id="lista-agendamentos"><div class="vazio">Carregando...</div></div>
    </div>
  </div>

  <!-- ── NOVO AGENDAMENTO ── -->
  <div id="sec-novo-agendamento" class="secao">
    <div class="card">
      <h2>Novo Agendamento</h2>
      <div class="grid">
        <div>
          <label>Cliente</label>
          <select id="sel-cliente"><option value="">Selecione...</option></select>
        </div>
        <div>
          <label>Profissional</label>
          <select id="sel-profissional"><option value="">Selecione...</option></select>
        </div>
        <div>
          <label>Serviço</label>
          <select id="sel-servico"><option value="">Selecione...</option></select>
        </div>
        <div>
          <label>Data e Hora</label>
          <input type="datetime-local" id="input-data" step="1800" />
          <span style="font-size:0.75rem;color:#6b7280;margin-top:0.25rem;display:block">Horários em intervalos de 30 min (ex: 10:00, 10:30)</span>
        </div>
      </div>
      <div class="mt">
        <label>Observações (opcional)</label>
        <textarea id="input-obs" rows="2" style="resize:none"></textarea>
      </div>
      <div class="mt">
        <button class="btn btn-primary" onclick="criarAgendamento()">Confirmar Agendamento</button>
      </div>
    </div>
  </div>

  <!-- ── CLIENTES ── -->
  <div id="sec-clientes" class="secao">
    <div class="card">
      <h2>Cadastrar Cliente</h2>
      <div class="grid col3">
        <div><label>Nome</label><input id="c-nome" placeholder="João Silva" /></div>
        <div><label>Telefone</label><input id="c-tel" placeholder="19999999999" /></div>
        <div><label>E-mail</label><input id="c-email" placeholder="joao@email.com" /></div>
      </div>
      <div class="mt">
        <button class="btn btn-primary" onclick="criarCliente()">Cadastrar</button>
      </div>
    </div>
    <div class="card">
      <h2>Clientes Cadastrados</h2>
      <div id="lista-clientes"><div class="vazio">Carregando...</div></div>
    </div>
  </div>

  <!-- ── PROFISSIONAIS ── -->
  <div id="sec-profissionais" class="secao">
    <div class="card">
      <h2>Cadastrar Profissional</h2>
      <div class="grid">
        <div><label>Nome</label><input id="p-nome" placeholder="Carlos" /></div>
        <div>
          <label>Especialidades</label>
          <div style="display:flex; gap:1rem; margin-top:0.4rem; flex-wrap:wrap">
            <label style="display:flex;align-items:center;gap:0.3rem;color:#333;font-size:0.9rem">
              <input type="checkbox" value="corte" class="esp"> Corte
            </label>
            <label style="display:flex;align-items:center;gap:0.3rem;color:#333;font-size:0.9rem">
              <input type="checkbox" value="barba" class="esp"> Barba
            </label>
            <label style="display:flex;align-items:center;gap:0.3rem;color:#333;font-size:0.9rem">
              <input type="checkbox" value="corte_e_barba" class="esp"> Corte + Barba
            </label>
            <label style="display:flex;align-items:center;gap:0.3rem;color:#333;font-size:0.9rem">
              <input type="checkbox" value="tratamento" class="esp"> Tratamento
            </label>
          </div>
        </div>
      </div>
      <div class="mt">
        <button class="btn btn-primary" onclick="criarProfissional()">Cadastrar</button>
      </div>
    </div>
    <div class="card">
      <h2>Profissionais Cadastrados</h2>
      <div id="lista-profissionais"><div class="vazio">Carregando...</div></div>
    </div>
  </div>

  <!-- ── SERVIÇOS ── -->
  <div id="sec-servicos" class="secao">
    <div class="card">
      <h2>Cadastrar Serviço</h2>
      <div class="grid col3">
        <div><label>Nome</label><input id="s-nome" placeholder="Corte Masculino" /></div>
        <div>
          <label>Tipo</label>
          <select id="s-tipo">
            <option value="corte">Corte</option>
            <option value="barba">Barba</option>
            <option value="corte_e_barba">Corte + Barba</option>
            <option value="tratamento">Tratamento</option>
          </select>
        </div>
        <div><label>Preço (R$)</label><input id="s-preco" type="number" placeholder="45.00" /></div>
      </div>
      <div class="mt">
        <button class="btn btn-primary" onclick="criarServico()">Cadastrar</button>
      </div>
    </div>
    <div class="card">
      <h2>Serviços Cadastrados</h2>
      <div id="lista-servicos"><div class="vazio">Carregando...</div></div>
    </div>
  </div>
</main>

<script>
  const API = "http://localhost:3000/api";

  async function req(method, url, body) {
    const res = await fetch(API + url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || "Erro desconhecido");
    return data;
  }

  function mostrarAlerta(msg, tipo = "ok") {
    const el = document.getElementById("alerta");
    el.className = `alerta alerta-${tipo}`;
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(() => el.style.display = "none", 4000);
  }

  function trocarAba(id) {
    document.querySelectorAll(".secao").forEach(s => s.classList.remove("ativa"));
    document.querySelectorAll("nav button").forEach(b => {
      b.classList.remove("ativo");
      if (b.getAttribute("onclick") === `trocarAba('${id}')`) b.classList.add("ativo");
    });
    document.getElementById("sec-" + id).classList.add("ativa");
    carregarDados(id);
  }

  function badgeStatus(status) {
    return `<span class="badge badge-${status}">${status}</span>`;
  }

  // ── Agendamentos ────────────────────────────────────────────────────────────

  async function carregarAgendamentos() {
    try {
      const dados = await req("GET", "/agendamentos");
      const el = document.getElementById("lista-agendamentos");
      if (!dados.length) { el.innerHTML = '<div class="vazio">Nenhum agendamento ainda.</div>'; return; }
      el.innerHTML = `<table>
        <thead><tr><th>Cliente</th><th>Profissional</th><th>Serviço</th><th>Data/Hora</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody>${dados.map(a => `
          <tr>
            <td>${a.cliente.nome}</td>
            <td>${a.profissional.nome}</td>
            <td>${a.servico.nome}</td>
            <td>${new Date(a.dataHora).toLocaleString("pt-BR")}</td>
            <td>${badgeStatus(a.status)}</td>
            <td class="acoes">
              ${a.status === "pendente" ? `<button class="btn btn-success btn-sm" onclick="confirmar('${a.id}')">Confirmar</button>` : ""}
              ${a.status !== "cancelado" && a.status !== "concluido" ? `<button class="btn btn-danger btn-sm" onclick="cancelar('${a.id}')">Cancelar</button>` : ""}
            </td>
          </tr>`).join("")}
        </tbody>
      </table>`;
    } catch(e) { document.getElementById("lista-agendamentos").innerHTML = `<div class="vazio">Erro ao carregar.</div>`; }
  }

  async function confirmar(id) {
    try { await req("PATCH", `/agendamentos/${id}/confirmar`); mostrarAlerta("Agendamento confirmado!"); carregarAgendamentos(); }
    catch(e) { mostrarAlerta(e.message, "erro"); }
  }

  async function cancelar(id) {
    if (!confirm("Cancelar este agendamento?")) return;
    try { await req("PATCH", `/agendamentos/${id}/cancelar`); mostrarAlerta("Agendamento cancelado."); carregarAgendamentos(); }
    catch(e) { mostrarAlerta(e.message, "erro"); }
  }

  async function criarAgendamento() {
    try {
      await req("POST", "/agendamentos", {
        clienteId: document.getElementById("sel-cliente").value,
        profissionalId: document.getElementById("sel-profissional").value,
        servicoId: document.getElementById("sel-servico").value,
        dataHora: document.getElementById("input-data").value,
        observacoes: document.getElementById("input-obs").value || undefined,
      });
      mostrarAlerta("Agendamento criado com sucesso!");
      trocarAba("agendamentos");
    } catch(e) { mostrarAlerta(e.message, "erro"); }
  }

  // ── Clientes ─────────────────────────────────────────────────────────────────

  async function carregarClientes() {
    const dados = await req("GET", "/clientes");
    const el = document.getElementById("lista-clientes");
    if (!dados.length) { el.innerHTML = '<div class="vazio">Nenhum cliente cadastrado.</div>'; return; }
    el.innerHTML = `<table>
      <thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th></tr></thead>
      <tbody>${dados.map(c => `<tr><td>${c.nome}</td><td>${c.telefone}</td><td>${c.email}</td></tr>`).join("")}</tbody>
    </table>`;
  }

  async function criarCliente() {
    try {
      await req("POST", "/clientes", {
        nome: document.getElementById("c-nome").value,
        telefone: document.getElementById("c-tel").value,
        email: document.getElementById("c-email").value,
      });
      mostrarAlerta("Cliente cadastrado!");
      ["c-nome","c-tel","c-email"].forEach(id => document.getElementById(id).value = "");
      carregarClientes();
    } catch(e) { mostrarAlerta(e.message, "erro"); }
  }

  // ── Profissionais ─────────────────────────────────────────────────────────────

  async function carregarProfissionais() {
    const dados = await req("GET", "/profissionais");
    const el = document.getElementById("lista-profissionais");
    if (!dados.length) { el.innerHTML = '<div class="vazio">Nenhum profissional cadastrado.</div>'; return; }
    el.innerHTML = `<table>
      <thead><tr><th>Nome</th><th>Especialidades</th></tr></thead>
      <tbody>${dados.map(p => `<tr><td>${p.nome}</td><td>${p.especialidades.join(", ")}</td></tr>`).join("")}</tbody>
    </table>`;
  }

  async function criarProfissional() {
    const especialidades = [...document.querySelectorAll(".esp:checked")].map(c => c.value);
    if (!especialidades.length) { mostrarAlerta("Selecione ao menos uma especialidade.", "erro"); return; }
    try {
      await req("POST", "/profissionais", { nome: document.getElementById("p-nome").value, especialidades });
      mostrarAlerta("Profissional cadastrado!");
      document.getElementById("p-nome").value = "";
      document.querySelectorAll(".esp").forEach(c => c.checked = false);
      carregarProfissionais();
    } catch(e) { mostrarAlerta(e.message, "erro"); }
  }

  // ── Serviços ──────────────────────────────────────────────────────────────────

  async function carregarServicos() {
    const dados = await req("GET", "/servicos");
    const el = document.getElementById("lista-servicos");
    if (!dados.length) { el.innerHTML = '<div class="vazio">Nenhum serviço cadastrado.</div>'; return; }
    el.innerHTML = `<table>
      <thead><tr><th>Nome</th><th>Tipo</th><th>Duração</th><th>Preço</th></tr></thead>
      <tbody>${dados.map(s => `<tr><td>${s.nome}</td><td>${s.tipo}</td><td>${s.duracaoMinutos} min</td><td>R$ ${s.preco.toFixed(2)}</td></tr>`).join("")}</tbody>
    </table>`;
  }

  async function criarServico() {
    try {
      await req("POST", "/servicos", {
        nome: document.getElementById("s-nome").value,
        tipo: document.getElementById("s-tipo").value,
        duracaoMinutos: 30,
        preco: parseFloat(document.getElementById("s-preco").value),
      });
      mostrarAlerta("Serviço cadastrado!");
      ["s-nome","s-preco"].forEach(id => document.getElementById(id).value = "");
      carregarServicos();
    } catch(e) { mostrarAlerta(e.message, "erro"); }
  }

  // ── Selects do formulário de agendamento ──────────────────────────────────────

  async function preencherSelects() {
    const [clientes, profissionais, servicos] = await Promise.all([
      req("GET", "/clientes"),
      req("GET", "/profissionais"),
      req("GET", "/servicos"),
    ]);
    const sel = (id, dados, label) => {
      document.getElementById(id).innerHTML =
        `<option value="">Selecione...</option>` +
        dados.map(d => `<option value="${d.id}">${d[label]}</option>`).join("");
    };
    sel("sel-cliente", clientes, "nome");
    sel("sel-profissional", profissionais, "nome");
    sel("sel-servico", servicos, "nome");
  }

  function carregarDados(aba) {
    if (aba === "agendamentos") carregarAgendamentos();
    else if (aba === "novo-agendamento") preencherSelects();
    else if (aba === "clientes") carregarClientes();
    else if (aba === "profissionais") carregarProfissionais();
    else if (aba === "servicos") carregarServicos();
  }

  carregarAgendamentos();
</script>
</body>
</html>
