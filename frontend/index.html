<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgendaFácil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; }

    nav {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      padding: 0 2rem;
    }
    nav button {
      padding: 0.9rem 1.25rem;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.9rem;
      color: #6b7280;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    nav button.ativo {
      color: #2563eb;
      border-bottom-color: #2563eb;
      font-weight: 500;
    }

    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }

    .secao { display: none; }
    .secao.ativa { display: block; }

    .card {
      background: white;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #111; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .grid.col3 { grid-template-columns: 1fr 1fr 1fr; }

    label { font-size: 0.8rem; color: #6b7280; display: block; margin-bottom: 0.25rem; }

    input, select, textarea {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus, select:focus { border-color: #2563eb; }

    .btn {
      padding: 0.6rem 1.25rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-sm { padding: 0.3rem 0.75rem; font-size: 0.8rem; }

    .mt { margin-top: 1rem; }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { text-align: left; padding: 0.6rem 0.75rem; background: #f9fafb; color: #6b7280; font-weight: 500; font-size: 0.8rem; border-bottom: 1px solid #e5e7eb; }
    td { padding: 0.75rem; border-bottom: 1px solid #f3f4f6; }
    tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .badge-pendente { background: #fef3c7; color: #92400e; }
    .badge-confirmado { background: #d1fae5; color: #065f46; }
    .badge-cancelado { background: #fee2e2; color: #991b1b; }
    .badge-concluido { background: #e0e7ff; color: #3730a3; }

    .alerta { padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.875rem; margin-bottom: 1rem; }
    .alerta-erro { background: #fee2e2; color: #991b1b; }
    .alerta-ok { background: #d1fae5; color: #065f46; }

    .vazio { text-align: center; padding: 2rem; color: #9ca3af; font-size: 0.9rem; }
    .acoes { display: flex; gap: 0.4rem; }
  </style>
</head>
<body>

<header>
  <span style="font-size:1.5rem">✂️</span>
  <h1>AgendaFácil</h1>
</header>

<nav>
  <button class="ativo">Agendamentos</button>
  <button>Novo Agendamento</button>
  <button>Clientes</button>
  <button>Profissionais</button>
  <button>Serviços</button>
</nav>

<main>
  <div id="alerta" style="display:none"></div>

  <div id="sec-agendamentos" class="secao ativa">
    <div class="card">
      <h2>Agendamentos</h2>
      <div id="lista-agendamentos"><div class="vazio">Carregando...</div></div>
    </div>
  </div>

  <div id="sec-clientes" class="secao">
    <div class="card">
      <h2>Cadastrar Cliente</h2>
      <div class="grid col3">
        <div><label>Nome</label><input id="c-nome" placeholder="João Silva" /></div>
        <div><label>Telefone</label><input id="c-tel" placeholder="19999999999" /></div>
        <div><label>E-mail</label><input id="c-email" placeholder="joao@email.com" /></div>
      </div>
      <div class="mt">
        <button class="btn btn-primary">Cadastrar</button>
      </div>
    </div>
    <div class="card">
      <h2>Clientes Cadastrados</h2>
      <div id="lista-clientes"><div class="vazio">Nenhum cliente cadastrado.</div></div>
    </div>
  </div>
</main>

</body>
</html>
