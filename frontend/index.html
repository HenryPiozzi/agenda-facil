<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgendaFácil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; }

    nav {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      padding: 0 2rem;
    }
    nav button {
      padding: 0.9rem 1.25rem;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.9rem;
      color: #6b7280;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    nav button.ativo {
      color: #2563eb;
      border-bottom-color: #2563eb;
      font-weight: 500;
    }

    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }

    .card {
      background: white;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #111; }

    .vazio { text-align: center; padding: 2rem; color: #9ca3af; font-size: 0.9rem; }
  </style>
</head>
<body>

<header>
  <span style="font-size:1.5rem">✂️</span>
  <h1>AgendaFácil</h1>
</header>

<nav>
  <button class="ativo">Agendamentos</button>
  <button>Novo Agendamento</button>
  <button>Clientes</button>
  <button>Profissionais</button>
  <button>Serviços</button>
</nav>

<main>
  <div class="card">
    <h2>Agendamentos</h2>
    <div class="vazio">Nenhum agendamento ainda.</div>
  </div>
</main>

</body>
</html>
